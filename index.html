<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0c">
  <title>Life OS · HIT & Nutrição</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <h1>
        <span class="sync-dot" id="sync-dot" title="Guardado localmente e pronto"></span>
        <span id="topbar-title">Hoje</span>
      </h1>
      <span class="date" id="today-label"></span>
    </div>
  </header>

  <div class="wrap">
    <!-- PÁGINA 0: HOJE (Resumo, Hábitos com Streak & Tarefas) -->
    <main class="page-view active" id="page-hoje"></main>

    <!-- PÁGINA 1: TREINO & PASSADEIRA -->
    <main class="page-view" id="page-treino"></main>

    <!-- PÁGINA 2: NUTRIÇÃO, ÁGUA, PROTEÍNA & SUPLEMENTOS -->
    <main class="page-view" id="page-nutri"></main>

    <!-- PÁGINA 3: DEFINIÇÕES & SISTEMA (Planos, Tiers, Cloud & Backup) -->
    <main class="page-view" id="page-def"></main>
  </div>

  <nav class="bottom-nav" aria-label="Navegação principal">
    <div class="bottom-nav-inner">
      <button class="nav-tab active" type="button" data-target="page-hoje" data-title="Resumo de Hoje" aria-label="Abrir aba Hoje">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Hoje <span class="nav-badge" id="nav-badge-hoje"></span></span>
      </button>

      <button class="nav-tab" type="button" data-target="page-treino" data-title="Treino & Cardio" aria-label="Abrir aba Treino">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5 17.5 17.5"/><path d="M3 10l7-7"/><path d="M14 21l7-7"/><path d="M2 6l4-4"/><path d="M18 22l4-4"/></svg>
        <span>Treino <span class="nav-badge" id="nav-badge-treino"></span></span>
      </button>

      <button class="nav-tab" type="button" data-target="page-nutri" data-title="Nutrição & Hidratação" aria-label="Abrir aba Nutrição">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
        <span>Nutrição <span class="nav-badge" id="nav-badge-nutri"></span></span>
      </button>

      <button class="nav-tab" type="button" data-target="page-def" data-title="Definições & Sistema" aria-label="Abrir aba Definições">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Definições</span>
      </button>
    </div>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
