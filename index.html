<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0c">
  <title>Life OS · HIT & Nutrição</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <h1>
        <span class="sync-dot" id="sync-dot" title="Guardado localmente e pronto"></span>
        <span id="topbar-title">Treino & Cardio</span>
      </h1>
      <span class="date" id="today-label"></span>
    </div>
  </header>

  <div class="wrap">
    <!-- PÁGINA 1: TREINO & PASSADEIRA -->
    <main class="page-view active" id="page-treino"></main>

    <!-- PÁGINA 2: NUTRIÇÃO, ÁGUA, PESO & SUPLEMENTOS -->
    <main class="page-view" id="page-nutri"></main>

    <!-- PÁGINA 3: METAS DIÁRIAS, CONSISTÊNCIA & SISTEMA -->
    <main class="page-view" id="page-metas"></main>
  </div>

  <nav class="bottom-nav" aria-label="Navegação principal">
    <div class="bottom-nav-inner">
      <button class="nav-tab active" type="button" data-target="page-treino" data-title="Treino & Cardio" aria-label="Abrir página de Treino e Cardio">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5 17.5 17.5"/><path d="M3 10l7-7"/><path d="M14 21l7-7"/><path d="M2 6l4-4"/><path d="M18 22l4-4"/></svg>
        <span>Treino <span class="nav-badge" id="nav-badge-treino"></span></span>
      </button>

      <button class="nav-tab" type="button" data-target="page-nutri" data-title="Nutrição & Hidratação" aria-label="Abrir página de Nutrição e Hidratação">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
        <span>Nutrição <span class="nav-badge" id="nav-badge-nutri"></span></span>
      </button>

      <button class="nav-tab" type="button" data-target="page-metas" data-title="Metas & Sistema" aria-label="Abrir página de Metas, Consistência e Sistema">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="m9 16 2 2 4-4"/></svg>
        <span>Metas <span class="nav-badge" id="nav-badge-metas"></span></span>
      </button>
    </div>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
